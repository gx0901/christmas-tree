<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎄 圣诞快乐 · 动态圣诞树</title>
  <style>
    /* ============ 基础重置 ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: radial-gradient(ellipse at 50% 12%, #2a3f74 0%, #151d42 48%, #070b1e 100%);
      color: #fff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overflow: hidden;
    }

    /* ============ 月亮 ============ */
    .moon {
      position: fixed;
      top: 7vmin;
      right: 9vmin;
      width: 13vmin;
      height: 13vmin;
      border-radius: 50%;
      background: radial-gradient(circle at 38% 36%, #fffde8 0%, #f4e9c0 45%, #d9cd9f 100%);
      box-shadow: 0 0 20px 5px rgba(255, 250, 220, .35), 0 0 70px 20px rgba(255, 250, 220, .14);
      z-index: 0;
    }

    /* ============ 背景星星 ============ */
    .bgstar {
      position: fixed;
      width: .5vmin;
      height: .5vmin;
      border-radius: 50%;
      background: #fff;
      z-index: 0;
      animation: twinkle 2.4s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: .12; }
      50%      { opacity: .95; }
    }

    /* ============ 树后光晕 ============ */
    .glow {
      position: fixed;
      left: 50%;
      bottom: 4vmin;
      transform: translateX(-50%);
      width: 95vmin;
      height: 72vmin;
      background: radial-gradient(ellipse at 50% 68%, rgba(80, 190, 135, .28) 0%, rgba(70, 130, 220, .14) 45%, transparent 72%);
      filter: blur(6px);
      z-index: 1;
      pointer-events: none;
    }

    /* ============ 标题 ============ */
    .title {
      position: fixed;
      top: 4vmin;
      width: 100%;
      text-align: center;
      font-size: 7vmin;
      font-weight: 800;
      letter-spacing: .08em;
      background: linear-gradient(180deg, #fff 0%, #ffe9a8 40%, #ffd76e 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(255, 214, 110, .5));
      animation: titleFloat 3s ease-in-out infinite;
      z-index: 6;
      pointer-events: none;
    }
    .title .sub {
      display: block;
      font-size: 3.2vmin;
      font-weight: 600;
      letter-spacing: .5em;
      margin-top: .6vmin;
      color: #cfe0ff;
      -webkit-text-fill-color: #cfe0ff;
    }
    @keyframes titleFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-1.6vmin); }
    }

    /* ============ 地面雪堆 ============ */
    .ground {
      position: fixed;
      bottom: -8vmin;
      left: 50%;
      transform: translateX(-50%);
      width: 130vw;
      height: 19vmin;
      background: radial-gradient(ellipse at 50% 42%, #f2f7ff 0%, #cddcf2 55%, transparent 100%);
      z-index: 2;
    }

    /* ============ 圣诞树 ============ */
    .layer {
      position: fixed;
      left: 50vw;
      transform: translateX(-50%);
      clip-path: polygon(50% 0%, 2% 100%, 98% 100%);
      background: linear-gradient(180deg, #43c780 0%, #27925c 52%, #145836 100%);
      filter: drop-shadow(0 4px 14px rgba(0, 0, 0, .35)) drop-shadow(0 0 18px rgba(70, 210, 130, .28));
      z-index: 3;
    }
    .l1 { bottom: 9vmin;  width: 56vmin; height: 30vmin; }
    .l2 { bottom: 26vmin; width: 46vmin; height: 28vmin; }
    .l3 { bottom: 42vmin; width: 36vmin; height: 26vmin; }
    .l4 { bottom: 58vmin; width: 25vmin; height: 24vmin; }

    /* 树干 */
    .trunk {
      position: fixed;
      left: 50vw;
      bottom: 2vmin;
      transform: translateX(-50%);
      width: 7vmin;
      height: 9.5vmin;
      background: linear-gradient(180deg, #9a6637, #5c3a1e);
      border-radius: 0 0 1.4vmin 1.4vmin;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06), 0 .4vmin 1.2vmin rgba(0, 0, 0, .4);
      z-index: 3;
    }

    /* ============ 树顶星星（SVG 金色星 + 光晕） ============ */
    .starglow {
      position: fixed;
      left: 50vw;
      bottom: 79vmin;
      transform: translateX(-50%);
      width: 27vmin;
      height: 27vmin;
      background: radial-gradient(circle, rgba(255, 220, 120, .55) 0%, rgba(255, 220, 120, 0) 70%);
      z-index: 3;
      pointer-events: none;
      animation: starGlowPulse 2s ease-in-out infinite;
    }
    .rays {
      position: fixed;
      left: 50vw;
      bottom: 77.5vmin;
      transform: translateX(-50%);
      width: 24vmin;
      height: 24vmin;
      background: repeating-conic-gradient(from 0deg, rgba(255, 224, 120, .9) 0deg 7deg, rgba(255, 224, 120, 0) 7deg 15deg);
      -webkit-mask-image: radial-gradient(circle, transparent 0 24%, #000 26% 50%, transparent 55% 100%);
      mask-image: radial-gradient(circle, transparent 0 24%, #000 26% 50%, transparent 55% 100%);
      filter: blur(.6px);
      animation: spin 8s linear infinite;
      z-index: 3;
      pointer-events: none;
    }
    @keyframes spin {
      to { transform: translateX(-50%) rotate(360deg); }
    }
    .star {
      position: fixed;
      left: 50vw;
      bottom: 84vmin;
      transform: translateX(-50%);
      width: 11vmin;
      height: 11vmin;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, .95)) drop-shadow(0 0 24px rgba(255, 190, 60, .7));
      animation: starPulse 2s ease-in-out infinite;
      z-index: 4;
    }
    @keyframes starPulse {
      0%, 100% { transform: translateX(-50%) scale(1)    rotate(0deg); }
      50%      { transform: translateX(-50%) scale(1.16) rotate(8deg); }
    }
    @keyframes starGlowPulse {
      0%, 100% { transform: translateX(-50%) scale(1);    opacity: 1; }
      50%      { transform: translateX(-50%) scale(1.25); opacity: .8; }
    }

    /* ============ 装饰球 ============ */
    .ornament {
      position: fixed;
      width: 2.6vmin;
      height: 2.6vmin;
      border-radius: 50%;
      box-shadow: 0 0 8px rgba(255, 255, 255, .75), 0 0 14px currentColor;
      animation: blink 1.4s ease-in-out infinite;
      z-index: 4;
    }
    .ornament::after {
      content: '';
      position: absolute;
      top: 14%;
      left: 22%;
      width: 36%;
      height: 36%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, .95) 0%, rgba(255, 255, 255, 0) 70%);
    }
    @keyframes blink {
      0%, 100% { opacity: 1;    transform: translateX(-50%) scale(1); }
      50%      { opacity: .32;  transform: translateX(-50%) scale(.82); }
    }

    /* ============ 树边灯串 ============ */
    .edgelight {
      position: fixed;
      width: 1.7vmin;
      height: 1.7vmin;
      border-radius: 50%;
      background: #ffe28a;
      box-shadow: 0 0 6px 2px rgba(255, 226, 138, .9), 0 0 12px 4px rgba(255, 200, 80, .5);
      z-index: 4;
      animation: twinkle 1.6s ease-in-out infinite;
    }

    /* ============ 礼物盒 ============ */
    .gift {
      position: fixed;
      bottom: 3vmin;
      border-radius: .8vmin;
      background: var(--gift);
      box-shadow: 0 .5vmin 1.4vmin rgba(0, 0, 0, .4);
      z-index: 3;
    }
    .gift::before {   /* 盖子 */
      content: '';
      position: absolute;
      top: 0;
      left: -6%;
      width: 112%;
      height: 40%;
      background: var(--gift);
      filter: brightness(1.25);
      border-radius: .6vmin;
    }
    .gift::after {    /* 竖丝带 */
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 16%;
      height: 100%;
      background: rgba(255, 255, 255, .65);
    }
    .g1 { left: calc(50vw - 24vmin); width: 10vmin;  height: 7.5vmin;  --gift: #e74c5e; }
    .g2 { left: calc(50vw + 12vmin); width: 8.5vmin; height: 6.5vmin; --gift: #4aa3ff; }
    .g3 { left: calc(50vw + 23vmin); width: 8vmin;   height: 6vmin;   --gift: #ffd166; }

    /* ============ 雪花 ============ */
    .snow {
      position: fixed;
      top: -6vh;
      width: 1vmin;
      height: 1vmin;
      border-radius: 50%;
      background: #fff;
      opacity: .9;
      filter: blur(.4px);
      z-index: 7;
      pointer-events: none;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0%   { transform: translateY(0) translateX(0); }
      100% { transform: translateY(118vh) translateX(var(--dx)); opacity: .4; }
    }

    /* ============ 祝福语气泡 ============ */
    .blessing {
      position: fixed;
      padding: 1.2vmin 3.4vmin;
      border: 1px solid rgba(255, 255, 255, .35);
      background: rgba(255, 255, 255, .08);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      border-radius: 999px;
      color: #ffe9a8;
      font-size: 3.4vmin;
      letter-spacing: .12em;
      white-space: nowrap;
      text-shadow: 0 0 10px rgba(255, 214, 110, .5);
      z-index: 5;
      pointer-events: none;
      animation: floatUp linear infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) translateX(0) scale(.9); opacity: 0; }
      8%   { opacity: 1; }
      100% { transform: translateY(-128vh) translateX(var(--dx)) scale(1.06); opacity: 0; }
    }

    /* ============ 音乐按钮 ============ */
    .music-btn {
      position: fixed;
      top: 3vmin;
      left: 3vmin;
      width: 11vmin;
      height: 11vmin;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .4);
      background: rgba(255, 255, 255, .1);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      font-size: 5.5vmin;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 8;
      box-shadow: 0 0 12px rgba(255, 255, 255, .25);
      transition: transform .15s ease, background .2s ease;
    }
    .music-btn:active { transform: scale(.9); }
    .music-btn.on {
      background: rgba(255, 214, 110, .2);
      border-color: rgba(255, 214, 110, .75);
      animation: musicPulse 1.4s ease-in-out infinite;
    }
    @keyframes musicPulse {
      0%, 100% { box-shadow: 0 0 10px rgba(255, 214, 110, .35); }
      50%      { box-shadow: 0 0 26px rgba(255, 214, 110, .8); }
    }

    /* 底部提示 */
    .hint {
      position: fixed;
      bottom: 3vmin;
      width: 100%;
      text-align: center;
      font-size: 3.2vmin;
      color: rgba(255, 255, 255, .78);
      letter-spacing: .2em;
      z-index: 6;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="moon"></div>

  <button class="music-btn" id="musicBtn" aria-label="播放音乐">🎵</button>

  <div class="title">🎄 圣诞快乐 🎄<span class="sub">MERRY CHRISTMAS</span></div>

  <div class="glow"></div>
  <div class="ground"></div>

  <div class="starglow"></div>
  <div class="rays"></div>
  <svg class="star" viewBox="0 0 24 24" aria-hidden="true">
    <defs>
      <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"  stop-color="#fff7c0"/>
        <stop offset="55%" stop-color="#ffd76e"/>
        <stop offset="100%" stop-color="#f5a623"/>
      </linearGradient>
    </defs>
    <path d="M12 1.5l2.6 5.9 6.4.6-4.8 4.3 1.4 6.3-5.6-3.3-5.6 3.3 1.4-6.3-4.8-4.3 6.4-.6z"
          fill="url(#gold)" stroke="#fff3b0" stroke-width=".4" stroke-linejoin="round"/>
  </svg>

  <div class="layer l1"></div>
  <div class="layer l2"></div>
  <div class="layer l3"></div>
  <div class="layer l4"></div>
  <div class="trunk"></div>

  <div class="gift g1"></div>
  <div class="gift g2"></div>
  <div class="gift g3"></div>

  <div class="hint">✨ 轻点屏幕，送出祝福 ✨</div>

  <script>
    // ============ 祝福语列表（想改字就改这里） ============
    const BLESSINGS = [
      '圣诞快乐', 'Merry Christmas', '平安喜乐', '万事胜意',
      '阖家幸福', '心想事成', '岁岁平安', '好运连连',
      '前程似锦', '幸福安康', '喜乐安康', '如意吉祥'
    ];

    const ORN_COLORS = ['#ff4d6b', '#ffd166', '#4dd0ff', '#ff8fd0',
                        '#8dff9a', '#ffb347', '#ffffff', '#c77dff'];

    // ============ 树的每一层（用于撒装饰球和灯串） ============
    // bottom=距屏幕底部, height=层高, width=层宽（半宽 = width/2）
    const LAYERS = [
      { bottom: 9,  height: 30, width: 56 },
      { bottom: 26, height: 28, width: 46 },
      { bottom: 42, height: 26, width: 36 },
      { bottom: 58, height: 24, width: 25 }
    ];

    // ============ 装饰球：撒在每层三角形内部 ============
    function makeOrnaments() {
      LAYERS.forEach(layer => {
        const count = Math.floor(layer.width / 4);
        for (let i = 0; i < count; i++) {
          const o = document.createElement('div');
          o.className = 'ornament';
          const t = 0.15 + Math.random() * 0.7;          // 越靠下三角形越宽
          const halfW = (layer.width / 2) * t;
          const dx = (Math.random() * 2 - 1) * halfW * 0.72;
          const color = ORN_COLORS[Math.floor(Math.random() * ORN_COLORS.length)];
          o.style.left = `calc(50vw + ${dx.toFixed(2)}vmin)`;
          o.style.bottom = `${(layer.bottom + t * layer.height).toFixed(2)}vmin`;
          o.style.background = color;
          o.style.color = color;                        // 让 box-shadow 用 currentColor 发光
          o.style.animationDelay = `${(Math.random() * 1.6).toFixed(2)}s`;
          o.style.animationDuration = `${(0.9 + Math.random() * 1.2).toFixed(2)}s`;
          document.body.appendChild(o);
        }
      });
    }

    // ============ 树边灯串：沿三角形两条斜边点缀 ============
    function makeEdgeLights() {
      LAYERS.forEach(layer => {
        const halfW = layer.width / 2;
        const n = Math.max(5, Math.floor(layer.width / 5));
        for (let i = 1; i < n; i++) {
          const s = i / n;                    // 0=树顶尖 1=树底边
          const y = layer.bottom + (1 - s) * layer.height;
          const x = halfW * s;
          [[-1], [1]].forEach(side => {
            const l = document.createElement('div');
            l.className = 'edgelight';
            l.style.left = `calc(50vw + ${(side[0] * x).toFixed(2)}vmin)`;
            l.style.bottom = `${y.toFixed(2)}vmin`;
            l.style.animationDelay = `${(Math.random() * 1.6).toFixed(2)}s`;
            l.style.animationDuration = `${(0.8 + Math.random() * 1.4).toFixed(2)}s`;
            document.body.appendChild(l);
          });
        }
      });
    }

    // ============ 背景星星 ============
    function makeBgStars() {
      for (let i = 0; i < 46; i++) {
        const s = document.createElement('div');
        s.className = 'bgstar';
        s.style.left = `${(Math.random() * 100).toFixed(2)}vw`;
        s.style.top = `${(Math.random() * 72).toFixed(2)}vh`;
        s.style.animationDelay = `${(Math.random() * 2.4).toFixed(2)}s`;
        document.body.appendChild(s);
      }
    }

    // ============ 雪花 ============
    function makeSnow() {
      for (let i = 0; i < 60; i++) {
        const s = document.createElement('div');
        s.className = 'snow';
        const size = 0.5 + Math.random() * 1.2;
        s.style.width = `${size.toFixed(2)}vmin`;
        s.style.height = `${size.toFixed(2)}vmin`;
        s.style.left = `${(Math.random() * 100).toFixed(2)}vw`;
        s.style.setProperty('--dx', `${(Math.random() * 8 - 4).toFixed(2)}vw`);
        s.style.animationDuration = `${(6 + Math.random() * 8).toFixed(2)}s`;
        s.style.animationDelay = `${(-Math.random() * 14).toFixed(2)}s`;
        s.style.opacity = (0.4 + Math.random() * 0.6).toFixed(2);
        document.body.appendChild(s);
      }
    }

    // ============ 祝福语气泡（循环上浮） ============
    function makeBlessing(left, bottom, duration) {
      const b = document.createElement('div');
      b.className = 'blessing';
      b.textContent = BLESSINGS[Math.floor(Math.random() * BLESSINGS.length)];
      b.style.left = left;
      b.style.bottom = bottom;
      b.style.setProperty('--dx', `${(Math.random() * 12 - 6).toFixed(2)}vw`);
      b.style.animationDuration = duration;
      b.style.animationDelay = `${(-Math.random() * 14).toFixed(2)}s`;
      document.body.appendChild(b);
      return b;
    }

    function seedBlessings() {
      for (let i = 0; i < 14; i++) {
        makeBlessing(
          `${(Math.random() * 90 + 5).toFixed(2)}vw`,
          `${(-Math.random() * 20).toFixed(2)}vh`,
          `${(9 + Math.random() * 7).toFixed(2)}s`
        );
      }
    }

    // ============ 点击屏幕：从点击处飘出一个祝福 ============
    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.music-btn')) return;
      const b = document.createElement('div');
      b.className = 'blessing';
      b.textContent = BLESSINGS[Math.floor(Math.random() * BLESSINGS.length)];
      b.style.left = `${e.clientX}px`;
      b.style.top = `${e.clientY}px`;
      b.style.bottom = 'auto';
      b.style.setProperty('--dx', `${(Math.random() * 10 - 5).toFixed(2)}vw`);
      b.style.animation = 'floatUp 4.5s ease-out forwards';
      b.style.fontSize = '5vmin';
      b.addEventListener('animationend', () => b.remove());
      document.body.appendChild(b);
    });

    // ============ 背景音乐（Web Audio 合成《铃儿响叮当》，无需外部文件） ============
    const NOTE = {
      C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.00,
      A4: 440.00, B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.25,
      F5: 698.46, G5: 783.99, A5: 880.00
    };
    // [音名, 拍数] —— 《铃儿响叮当》副歌
    const MELODY = [
      ['E5',1],['E5',1],['E5',2],
      ['E5',1],['E5',1],['E5',2],
      ['E5',1],['G5',1],['C5',1.5],['D5',0.5],['E5',4],
      ['F5',1],['F5',1],['F5',1],['F5',0.5],['F5',0.5],
      ['F5',1],['E5',1],['E5',1],['E5',0.5],['E5',0.5],
      ['E5',1],['D5',1],['D5',1],['E5',1],['D5',2],['G5',2]
    ];

    let audioCtx = null, isPlaying = false, noteIndex = 0, nextNoteTime = 0, timerId = null;
    const BPM = 152, BEAT = 60 / BPM;

    function scheduleNote(i, t) {
      const [name, dur] = MELODY[i];
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = NOTE[name];
      const start = t, end = t + dur * BEAT;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.2, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, end);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(end + 0.02);
    }

    function tick() {
      while (nextNoteTime < audioCtx.currentTime + 0.3) {
        scheduleNote(noteIndex, nextNoteTime);
        nextNoteTime += MELODY[noteIndex][1] * BEAT;
        noteIndex = (noteIndex + 1) % MELODY.length;
      }
    }

    function startMusic() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      nextNoteTime = audioCtx.currentTime + 0.05;
      noteIndex = 0;
      timerId = setInterval(tick, 30);
      isPlaying = true;
    }
    function stopMusic() {
      clearInterval(timerId);
      isPlaying = false;
    }

    const musicBtn = document.getElementById('musicBtn');
    musicBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (isPlaying) {
        stopMusic();
        musicBtn.classList.remove('on');
        musicBtn.textContent = '🎵';
      } else {
        startMusic();
        musicBtn.classList.add('on');
        musicBtn.textContent = '🎶';
      }
    });

    // ============ 启动 ============
    makeOrnaments();
    makeEdgeLights();
    makeBgStars();
    makeSnow();
    seedBlessings();
  </script>
</body>
</html>
